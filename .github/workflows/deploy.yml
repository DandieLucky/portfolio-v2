name: Deploy portfolio v2

# Setiap push ke main → build ulang → terbit otomatis.
# Bisa juga dijalankan manual dari tab Actions (Run workflow).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'DandieLucky/portfolio-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci memakai package-lock.json → versi dependensi persis sama
      # dengan yang sudah teruji di lokal.
      - name: Pasang dependensi
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-portfolio-pdf.txt

      - name: Pasang renderer PDF
        run: python -m pip install -r scripts/requirements-portfolio-pdf.txt

      - name: Build
        env:
          SITE_BASE: /portfolio-v2
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
